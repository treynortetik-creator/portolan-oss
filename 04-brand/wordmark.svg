<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 355 64" width="355" height="64"
     fill="currentColor" role="img" aria-labelledby="pl-title">
  <title id="pl-title">Portolan</title>

  <!-- MARK — an enclosed windrose: one center node, four edges, four nodes, one horizon.
       10 shapes. Reads at 24px tall. Rhumb-line red as of 2026-09-18 (the maintainer: "make that
       red, like the whole little circle logo"): this group now carries its own explicit
       fill instead of inheriting currentColor the way the WORDMARK letters below still
       do, so the mark stays red and the letters stay ink no matter what color the
       surrounding page sets. The var() fallback is the light-mode accent hex, so the mark
       still reads red if this file is ever opened standalone with no page stylesheet
       loaded. See 04-brand/brand-tokens.css for the accent token itself. -->
  <g fill="var(--pl-accent, #C0362C)">
    <!-- horizon (the boundary: nothing leaves it) -->
    <path fill-rule="evenodd"
          d="M2,32 A30,30 0 1,0 62,32 A30,30 0 1,0 2,32 Z
             M6.5,32 A25.5,25.5 0 1,0 57.5,32 A25.5,25.5 0 1,0 6.5,32 Z"/>
    <!-- center node -->
    <circle cx="32" cy="32" r="5"/>
    <!-- four edges + four nodes -->
    <g transform="translate(32,32) rotate(45)"><path d="M6.5,-1.5 H12.5 V1.5 H6.5 Z"/><circle cx="17.5" cy="0" r="5.5"/></g>
    <g transform="translate(32,32) rotate(135)"><path d="M6.5,-1.5 H12.5 V1.5 H6.5 Z"/><circle cx="17.5" cy="0" r="5.5"/></g>
    <g transform="translate(32,32) rotate(225)"><path d="M6.5,-1.5 H12.5 V1.5 H6.5 Z"/><circle cx="17.5" cy="0" r="5.5"/></g>
    <g transform="translate(32,32) rotate(315)"><path d="M6.5,-1.5 H12.5 V1.5 H6.5 Z"/><circle cx="17.5" cy="0" r="5.5"/></g>
  </g>

  <!-- WORDMARK — monoline engraved capitals, drawn as paths (no font dependency).
       Cap height 40, stroke 6, letterspacing 8. -->
  <!-- P -->
  <g transform="translate(84,12)">
    <path d="M0,0 H6 V40 H0 Z"/>
    <path d="M6,0 A15,13 0 0,1 6,26 L6,20 A9,7 0 0,0 6,6 Z"/>
  </g>
  <!-- O -->
  <g transform="translate(113,12)">
    <path fill-rule="evenodd"
          d="M0,20 A15,20 0 1,0 30,20 A15,20 0 1,0 0,20 Z
             M6,20 A9,14 0 1,0 24,20 A9,14 0 1,0 6,20 Z"/>
  </g>
  <!-- R -->
  <g transform="translate(151,12)">
    <path d="M0,0 H6 V40 H0 Z"/>
    <path d="M6,0 A15,13 0 0,1 6,26 L6,20 A9,7 0 0,0 6,6 Z"/>
    <path d="M12,19 H18 L25,40 H19 Z"/>
  </g>
  <!-- T -->
  <g transform="translate(184,12)">
    <path d="M0,0 H26 V6 H0 Z"/>
    <path d="M10,0 H16 V40 H10 Z"/>
  </g>
  <!-- O -->
  <g transform="translate(218,12)">
    <path fill-rule="evenodd"
          d="M0,20 A15,20 0 1,0 30,20 A15,20 0 1,0 0,20 Z
             M6,20 A9,14 0 1,0 24,20 A9,14 0 1,0 6,20 Z"/>
  </g>
  <!-- L -->
  <g transform="translate(256,12)">
    <path d="M0,0 H6 V40 H0 Z"/>
    <path d="M0,34 H22 V40 H0 Z"/>
  </g>
  <!-- A -->
  <g transform="translate(286,12)">
    <path d="M0,40 H6 L18,0 H12 Z"/>
    <path d="M30,40 H24 L12,0 H18 Z"/>
    <path d="M8,26 H22 V32 H8 Z"/>
  </g>
  <!-- N -->
  <g transform="translate(324,12)">
    <path d="M0,0 H6 V40 H0 Z"/>
    <path d="M22,0 H28 V40 H22 Z"/>
    <path d="M0,0 H6 L28,40 H22 Z"/>
  </g>
</svg>
