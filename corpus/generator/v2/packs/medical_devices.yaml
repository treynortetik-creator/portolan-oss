        - "According to internal notes, {person} at {account} is pushing for {competitor}\u2019s {product} in the upcoming evaluation round."
        - "{person} has shared an internal report showing {competitor} outperforming {vendor} in certain {product} use cases."
        - "In their competitive matrix, {account} listed {competitor}\u2019s {product} as the top performer for integrated alerts and alarms."
