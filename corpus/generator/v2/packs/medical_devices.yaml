arcs:
  - id: rocky_go_live_v1
    arc_type: rocky_go_live
    weight: 1.2
    steps:
      - {event_type: go_live, day_offset: 0}
      - {event_type: incident, day_offset: 14}
      - {event_type: escalation, day_offset: 30}
      - {event_type: commitment_made, day_offset: 35}
      - {event_type: commitment_due, day_offset: 60}
      - {event_type: decision, day_offset: 75}
