decoy_classes:
  - id: hypothetical
    near_type: risk
    description: A hypothetical framed as if it already happened ("if a shipment ever ran late...").
    example: "Our team had a demo with Meridian Dynamics last quarter where their smart pump system seemed to handle complex medication protocols seamlessly, but we haven't moved forward with a full deployment yet."
  - id: negation
    near_type: request
    description: "A negation indicating no action is required without specifying context or implying any status"
    example: "I don't think there's anything that needs to be done on our part for now."
    forbidden_patterns: [competitor_evaluation]
    text_source:
      model: "qwen/qwen3-32b"
      generated: "2026-09-23"
      raw_response_sha256:
        - "70b02a210f55ffce4d14723643ad20c28e2e8bf37c5438232ccfccaa750d90c1"
  - id: hearsay_other_company
    near_type: competitor_mention
    description: Something said to have happened to a different, unnamed customer.
    example: "Haven't seen the same level of integration speed as AuroraMed's clients reportedly did with their Orion 700 series at a Colorado health system last year, but our setup's been stable enough."
  - id: generic_industry_talk
    near_type: other
    description: Industry chatter with no account-specific claim.
    example: "Everyone in the space is looking at automated infusor systems because of the regulatory push for more reliable devices this year."
  - id: rhetorical_question
    near_type: question
    description: A question asked for effect, not information, with no real open item.
    example: "Do you really need a whole team to handle one infusion pump? That seems extreme."
  - id: vendor_internal_speculation
    near_type: risk
    description: Vendor-side speculation about a customer, not a customer statement.
    example: "I think St. Clare\u2019s probably went with MedFlow Solutions because they needed faster IV automation than our system could deliver at the time."
  - id: resolved_issue_as_history
    near_type: complaint
    description: An already-resolved issue retold as past history, not a live complaint.
    example: "We had some hiccups with our old EHR compatibility back in 2021, but switched to VitaPulse's integration modules and it's been smooth sailing since\u2014no look-backs for us."

