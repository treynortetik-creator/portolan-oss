# Medical devices vertical pack -- WP1's one reference pack
# (`01-spec/world-generator-v2-2026-09-22.md` section 4). Validates against
# `corpus/generator/v2/packs/schema.py::VerticalPack`. This is the vertical
# v1 (`corpus/generator/worlds.py`) already covers (infusion pumps), kept
# as the reference so WP2's other seven packs have a working example to
# copy the shape of.

id: medical_devices
name: Medical devices
vendor_what: infusion pumps, monitoring hardware and integration modules sold to hospitals and health systems

products:
  - kind: infusion_pump_family
    name_template: "{line}"
    tiers: []
    known_issue_pool:
      - "occasional false occlusion alarms under low-flow rates"
      - "battery runtime shorter than spec on units over 18 months old"
  - kind: infusion_pump_unit
    name_template: "{line} {tier}"
    tiers: ["T2", "T3"]
    known_issue_pool:
      - "firmware 4.x reboot loop under a specific alarm-silence sequence"
      - "touchscreen drift after repeated autoclave cycles"
  - kind: ehr_bridge_module
    name_template: "{line} Link"
    tiers: []
    known_issue_pool:
      - "intermittent dropped updates when the EHR is mid-maintenance window"
  - kind: service_contract
    name_template: "{line} Care"
    tiers: []
    known_issue_pool: []

roles:
  - title: Director of Nursing
    seniority: director
    is_champion_candidate: true
  - title: Director of Clinical Engineering
    seniority: director
    is_champion_candidate: true
  - title: Biomed Engineering Lead
    seniority: staff
    is_champion_candidate: true
  - title: VP Supply Chain
    seniority: vp
    is_champion_candidate: false
  - title: CFO
    seniority: c_suite
    is_champion_candidate: false
  - title: Materials Manager
    seniority: manager
    is_champion_candidate: false
  - title: ICU Nurse Manager
    seniority: manager
    is_champion_candidate: true
  - title: Practice Administrator
    seniority: manager
    is_champion_candidate: false

event_templates:
  - event_type: go_live
    weight: 1.0
    claim_templates:
      usage:
        - "{product} is scheduled for go-live at {account} on {date}."
        - "{person} from {account} reported that {product} has been fully operational for {days} days."
        - "The {vendor} team is preparing {amount} new {product} devices for deployment with {account} by {date}."
        - "{account} has on {date} completed training for {amount} of its staff on {product} usage."
        - "Integration of {product} within {account} was confirmed to be complete as of {date}."
      complaint:
        - "Go-live of {product} at {account} was delayed by {days} days due to setup issues."
        - "{person} reported that {product} failed to connect to their EHR system on {date}."
        - "Support at {vendor} has been notified by {account} about a misconfigured {product} unit."
        - "Several {product} devices failed to initialize properly at {account} on {date}."
        - "{person} at {account} noted inconsistent drip rates reported in {product} logs as of {date}."
        - "A lack of documentation caused implementation challenges for {product} during {account}'s go-live on {date}."
  - event_type: release
    weight: 1.0
    claim_templates:
      usage:
        - "{product} was released at {account} on {date} with a planned rollout over {days} days."
        - "A software update to {product} was pushed to {account} on {date} affecting {amount} users."
        - "{person} from {vendor} visited {account} to support the {product} release and address live training needs."
        - "Release validation checks for {product} at {account} began on {date} and are concluded in {days} days."
        - "{account} has confirmed the successful release of {product} to {amount} units across the facility."
      praise:
        - "{person} at {account} praised the speed of the {product} release on {date}."
        - "The {vendor} team was commended for timely delivery of the {product} update to {account} on {date}."
        - "{account} has reported that {product} integration on {date} exceeded expectations in performance."
        - "The {product} launch at {account} on {date} was smooth and met all deployment milestones."
        - "Positive feedback from {account} highlighted how the {product} release simplified their care workflows by {date}."
        - "{person} from {vendor} received appreciation from {account} for supporting the {product} release on {date}."
        - "{product} has been widely adopted at {account} since the release on {date}, with no major issues."
        - "A staff training session on {product} at {account} completed on {date} received enthusiastic feedback."
        - "The {vendor} tech team was lauded for solving {product} kinks quickly during the release at {account}."
  - event_type: incident
    weight: 1.6
    claim_templates:
      complaint:
        - "On {date}, {person} at {account} observed a {product} malfunction leading to {days} downtime."
        - "{product} at {account} generated multiple errors on {date}, including communication failures."
        - "The {vendor} team was summoned when {product} at {account} failed to align with the EHR system on {date}."
        - "{account} experienced an unexpected {product} shutdown affecting {amount} patients during {days} days."
        - "A user at {account} triggered an alert for {product} overuse on {date}, impacting treatment accuracy."
        - "Data sync with {product} failed for {days} days at {account}, beginning on {date}."
        - "The {vendor} support team is investigating a complaint from {account} regarding {product} instability as of {date}."
      risk:
        - "The recent {product} incident at {account} has raised concerns about device reliability."
        - "Extended {days} downtime with {product} at {account} threatens our SLA obligations."
        - "Unaddressed {product} issues at {account} may delay future renewals and maintenance."
        - "If the {product} problem at {account} recurs, there's a high risk of contract termination."
  - event_type: escalation
    weight: 1.2
    claim_templates:
      risk:
        - "The {days}-day duration of the {product} issue escalation may impact our service reputation at {account}."
        - "{account} is considering legal action if {product} reliability is not resolved by {date}."
        - "An ongoing issue with {product} at {account} has prompted internal discussions about account risk."
        - "The unresolved complaint at {account} for {product} has created reputational risk within the clinical team."
      complaint:
        - "An issue with {product} reported by {account} on {date} has now been escalated for urgent resolution."
        - "On {date}, {person} from {account} requested escalation of their recurring {product} downtime issue."
        - "The {vendor} support team failed to resolve the {product} issue at {account}, leading to {days} of disruption."
        - "Multiple reports from {account} about {product} system lockups have been escalated to engineering."
        - "The {product} problem at {account} has been open for {days} days and is now under escalation review."
  - event_type: qbr
    weight: 1.4
    claim_templates:
      usage:
        - "In the QBR on {date}, {person} confirmed ongoing use of {product} in {amount} daily procedures."
        - "{product} has been used effectively at {account} for {days} consecutive days since deployment."
        - "Usage reporting for {product} at {account} during the QBR on {date} showed high adoption levels."
        - "The team at {account} updated {vendor} on how {product} has streamlined workflows over the past {days} days."
        - "During the QBR on {date}, {account} shared that {amount} staff now routinely use {product} without incident."
      praise:
        - "During the QBR on {date}, {account} praised the {product} team at {vendor} for exceptional support."
        - "{person} from {account} highlighted how {product} has improved patient outcomes since its deployment on {date}."
        - "The {account} leadership team noted significant operational efficiency from {product} in the QBR on {date}."
        - "In the recent QBR with {vendor}, {account} commended {product} for reducing manual data entry by {amount}."
        - "The QBR on {date} featured a glowing endorsement of {product} from {person} at {account}."
        - "{person} from {vendor} was recognized at {account}'s QBR on {date} for resolving {product} issues within {days} days."
        - "{product} has maintained its performance according to {account}'s latest QBR feedback on {date}."
        - "Positive trends in {product} usage at {account} were flagged in the QBR on {date}."
        - "In the QBR on {date}, {person} from {account} confirmed that {product} is meeting all clinical KPIs."
      question:
        - "{person} from {account} asked during the QBR on {date} how {vendor} monitors {product} usage performance across {amount} devices."
        - "A staff member from {account} inquired about {vendor}'s roadmap for {product} enhancements during the {date} meeting."
        - "At the QBR on {date}, {person} asked when the next major {product} update is scheduled for release."
        - "{person} from {account} requested clarification on how {vendor} tracks {days} of downtime for {product} in QBR discussions."
        - "During the QBR on {date}, {person} asked whether {vendor} supports automated case creation during {product} outages."
        - "The QBR on {date} included a question from {person} about how {vendor} ensures data integrity for {product} users."
        - "{person} at {account} asked if {vendor} offers API integration for {product} with third-party systems during their QBR on {date}."
        - "A rep from {account} inquired how {product} maintenance windows are scheduled during the QBR on {date}."
        - "In the QBR on {date}, {person} asked about the role of {vendor} in updating {product} as EHR systems evolve."
        - "{person} from {account} posed a question at the QBR on {date} regarding {vendor}\u2019s support of {product} for rural facilities."
        - "{person} inquired during the QBR on {date} how {vendor} plans to scale {product} for {account} as usage increases by {amount}."
        - "The QBR on {date} featured a question from {person} asking about {product}\u2019s compatibility with new clinical workflows."
        - "{person} asked in the QBR on {date} if {vendor} had metrics for how {product} is performing in {account}'s operating rooms."
        - "During the QBR on {date}, {person} asked about the recent delays in {product} feature rollouts."
        - "{person} inquired in the QBR on {date} whether {vendor} had tested {product} with the latest EHR updates from {account}."
        - "In the QBR on {date}, {person} asked how {vendor} can help {account} expand {product} use beyond the current {amount} units."
        - "{person} asked during the QBR on {date} if {vendor} could provide data showing how {product} reduces clinician workload."
        - "A question from {person} during the QBR on {date} highlighted the need for {product} training for {amount} new nurses."
  - event_type: renewal_step
    weight: 1.0
    claim_templates:
      decision:
        - "{account} has initiated the renewal process for {product} with a decision expected by {date}."
        - "In the renewal meeting on {date}, {person} from {account} confirmed they are choosing to extend their {product} contract."
        - "{account} has decided to include {days} of on-site {vendor} support in the next {product} renewal."
        - "The clinical leadership at {account} voted in favor of {product} extension following the QBR on {date}."
        - "{person} at {account} informed {vendor} of a final decision to renew {product} for {amount} additional units."
      pricing:
