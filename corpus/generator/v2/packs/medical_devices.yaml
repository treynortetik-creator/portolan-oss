        - "{vendor} proposed a new pricing structure for {product} that {account} is considering for a renewal decision on {date}."
        - "The pricing options for {product} were finalized at {account} on {date}, with {amount} set as the new contract value."
        - "{person} highlighted the importance of matching {amount} in savings during {account}\u2019s renewal pricing review on {date}."
        - "{account} requested revised pricing for {product} to be released before the renewal date of {date}."
        - "An invoice review for {product} at {account} on {date} noted {amount} as the expected renewal cost."
        - "Pricing negotiations for {product} at {account} are expected to last {days} days before finalization on {date}."
        - "During the renewal on {date}, {person} asked whether maintenance pricing for {product} has changed in the last {days}."
  - event_type: price_negotiation
    weight: 0.9
    claim_templates:
      pricing:
        - "{person} at {account} is seeking a {amount} price reduction for {product} during their negotiation on {date}."
