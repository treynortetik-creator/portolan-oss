        - "{vendor} was asked by {person} at {account} to provide a discount proposal for {product} within {days} after {date}."
        - "The team at {account} requested a custom evaluation of {product} pricing before finalizing any agreement by {date}."
        - "{person} requested a breakdown of {vendor}\u2019s per-unit {product} cost and fixed monthly charges for {account} on {date}."
        - "To facilitate budgeting, {account} asked {vendor} to provide a usage-based {product} pricing model by {date}."
        - "{person} at {account} asked the {product} team to include a 10% volume discount in the next pricing proposal for {days} more units."
        - "The Clinical Engineering Lead at {account} requested a revised pricing proposal for {product} after encountering three escalations."
        - "During the {date} negotiation, {person} from {account} asked {vendor} for a 5-year pricing guarantee for {product} volume of at least {amount}."
