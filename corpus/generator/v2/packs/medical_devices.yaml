        - "The clinical engineering team at {account} mentioned evaluating {competitor} in relation to {product} performance."
        - "During an internal review, {account} expressed interest in {competitor} despite active support from {vendor}."
        - "A recent report suggests {account} is re-evaluating {vendor} in favor of {competitor} after issues with {product}."
        - "Rumors within {account} suggest {competitor} is being invited to a competitive evaluation due to {product} concerns."
