decoy_classes:
  - id: hypothetical_ehr
    near_type: risk
    description: "A hypothetical framed as if it already happened."
    example: "We tried switching to MeridianHealth last year but had to back out when their EHR sync didn't hold up during claims testing."
  - id: negation_ehr
    near_type: request
    description: "Use a negation to indicate that no current action is necessary without implying any expectations or obligations."
    example: "I\u2019m not looking to make any changes to our current setup right now, but I\u2019ll keep you in mind if things evolve."
    forbidden_patterns: [competitor_evaluation]
    text_source:
      model: "qwen/qwen3-32b"
      generated: "2026-09-23"
      raw_response_sha256:
        - "04b64331f6de942c7f1be28a0e81a6f5eb28e0b7f8e601ee571760d8118911b8"
        - "9dcd3d39041513274e439972aa3ea1ba83c9fd4cdc99bae8d3b5bec7ff440c9b"
        - "3aa2d1bc85aca07bd7c8d6704a1fceb00bcf860461a9b9779f9dde923ea447ce"
  - id: hearsay_other_company_ehr
    near_type: competitor_mention
    description: "Something said to have happened to a different, unnamed customer."
    example: "Hospitals in the Midwest say their vendor's dashboard crashed during last quarter's peak load period."
  - id: generic_industry_talk_ehr
    near_type: other
    description: "Industry chatter with no account-specific claim."
    example: "Many health systems are struggling with HL7 v2 compatibility when integrating third-party EHR add-ons these days."
  - id: rhetorical_question_ehr
    near_type: question
    description: "A question asked for effect, not information, with no real open item."
    example: "Who could've imagined e-prescribing would be this smooth with today's technology?"
  - id: vendor_internal_speculation_ehr
    near_type: risk
    description: "Vendor-side speculation about a customer, not a customer statement."
    example: "They might pause expansion if the recent compliance issues aren't resolved by Q3 metrics review."
  - id: resolved_issue_as_history_ehr
    near_type: complaint
    description: "An already-resolved issue retold as past history, not a live complaint."
    example: "Last year's sync failure with the old portal was eventually fixed with a patch, so we don't expect it to recur."
  - id: commitment_decision_confusable_ehr
    near_type: decision
    description: "A vendor commitment restated in decision-shaped language, or a customer decision restated as if it were still an open vendor promise -- easy to mistype as the other fact type."
    example: "We agreed to a 3-year contract extension for the e-prescribing module, which we'll decide on next month's QBR agenda."

