# EHR add-ons vertical pack -- WP2 (`01-spec/world-generator-v2-2026-09-22.md`
# section 4). Validates against `corpus/generator/v2/packs/schema.py::VerticalPack`.

id: ehr_addons
name: EHR add-ons
vendor_what: "clinical documentation, interoperability, e-prescribing and revenue-cycle add-on modules sold to health systems running third-party EHRs"

products:
  - kind: clinical_documentation_improvement
    name_template: "{line}"
    tiers: []
    known_issue_pool:
      - "template auto-save lag on long encounter notes"
      - "coding-suggestion mismatches on complex encounters"
  - kind: interoperability_engine
    name_template: "{line} Connect"
    tiers: []
    known_issue_pool:
      - "HL7 message queue delays during EHR maintenance windows"
  - kind: e_prescribing_addon
    name_template: "{line} {tier}"
    tiers: ["Rx", "RxPlus"]
    known_issue_pool:
      - "formulary lookup timeouts during payer outages"
  - kind: population_health_dashboard
    name_template: "{line} Insights"
    tiers: []
    known_issue_pool: []
  - kind: revenue_cycle_coding_assist
    name_template: "{line} Code"
    tiers: []
    known_issue_pool:
      - "coding suggestions occasionally lag a payer's updated fee schedule"

roles:
  - title: "CIO"
    seniority: c_suite
    is_champion_candidate: true
  - title: "CMIO"
    seniority: c_suite
    is_champion_candidate: true
  - title: "Director of Health Information Management"
    seniority: director
    is_champion_candidate: true
  - title: "IT Integration Manager"
    seniority: manager
    is_champion_candidate: false
  - title: "VP Revenue Cycle"
    seniority: vp
    is_champion_candidate: false
  - title: "Physician Champion"
    seniority: staff
    is_champion_candidate: true
  - title: "Compliance Officer"
    seniority: manager
    is_champion_candidate: false
  - title: "CFO"
    seniority: c_suite
    is_champion_candidate: false

event_templates:
  - event_type: go_live
    weight: 1.0
    claim_templates:
      usage:
        - "{account} deployed {product} on {date} with {amount} users active in {days} days."
        - "{person} from {vendor} confirmed {product} went live at {account} after {days} of training."
        - "{product} at {account} is processing {amount} e-prescriptions daily since {date}."
        - "{vendor} reported {account} expanded {product} usage to {amount} clinics by {date}."
        - "{account} integrated {product} into {days} departments as of {date} per {person} notes."
      complaint:
        - "{person} from {vendor} received complaints about {product} crashing at {account} on {date}."
        - "{account} reported {product} integration delays caused {days} of workflow disruption by {date}."
        - "Users at {account} struggled with {product} documentation workflows since {date} launch."
        - "{vendor} technicians addressed {product} interoperability issues at {account} over {days}."
        - "{product} failed to process {amount} e-prescriptions at {account} during {date} go-live window."
        - "{account} escalated {product} performance problems to {vendor} {person} on {date} citing {days} downtime."
  - event_type: release
    weight: 1.0
    claim_templates:
      usage:
        - "{product} v{amount} was released to {account} on {date} with {days} of support prep."
        - "{vendor} rolled out {product} dashboard updates to {account} on {date} via {person}."
        - "{account} adopted {product} population health features on {date} after {days} testing."
        - "{person} at {account} reported {product} API upgrades live on {date} with {amount} nodes."
        - "{vendor} delivered {amount} new {product} templates to {account} by {date} per SLA."
      praise:
        - "{account} praised {vendor}'s {product} v{amount} updates during {date} call for improved workflow."
        - "Director of HIM at {account} commended {product} dashboard enhancements released on {date} as per {person} notes."
        - "{account} noted {product} API performance improvements in {date} metrics compared to previous release."
        - "Pharmacists at {account} reported 30% faster e-prescribing since {product} v{amount} launched on {date}."
        - "{person} from {vendor} received positive feedback from {account} about {product} scalability in {date} release."
        - "CMIO at {account} highlighted {product} documentation accuracy gains in {date} presentation after {vendor} release."
        - "{account} recognized {product} as \"most user-friendly\" during {date} health system showcase as per {person} report."
        - "Health system at {account} noted {product} reduced clinician note time by {amount}% in {date} usage review."
        - "IT at {account} commended {vendor} for resolving {product} interoperability issues in {date} post-release support."
  - event_type: incident
    weight: 1.6
    claim_templates:
      complaint:
        - "{product} at {account} experienced {days} hours of downtime starting {date} per {person} log."
        - "Pharmacists at {account} reported {product} e-prescription errors on {date} affecting {amount} orders."
        - "{vendor} acknowledged {product} data sync failures at {account} between {date} and {date}."
        - "{account} staff noted {product} dashboard inaccuracies since {date} requiring {days} to resolve."
        - "{person} from {vendor} documented {product} API failures at {account} impacting {amount} transactions."
        - "{account} filed an incident report about {product} crashing during {date} shift change."
      risk:
