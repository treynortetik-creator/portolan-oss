        - "{vendor} noted {account} postponed {product} training for {days} amid concerns over e-prescribing module accuracy by {date}."
      complaint:
        - "{account} escalated {product} usability issues to {vendor} {person} on {date} citing {days} unresolved."
        - "CMIO at {account} demanded {vendor} fix {product} interoperability by {date} after {days} delays."
        - "{person} from {vendor} escalated {account}'s {product} performance complaints to senior engineering on {date}."
        - "{account} reported {product} documentation errors caused {amount} revenue losses, prompting {date} escalation."
        - "Director of HIM at {account} escalated {product} compliance concerns to {vendor} {person} on {date}."
  - event_type: qbr
