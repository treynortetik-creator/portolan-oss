# Lab and imaging services vertical pack -- WP2 (`01-spec/world-generator-v2-2026-09-22.md`
# section 4). Validates against `corpus/generator/v2/packs/schema.py::VerticalPack`.
#
# Held-out vertical (spec section 4's own example: "an eighth held-out
# vertical (for example lab and imaging services) to measure how well the
# student generalizes past its training verticals"). Drawn only for
# test-split worlds -- never a train or validation world.

id: lab_and_imaging_services
name: Lab and imaging services
vendor_what: "laboratory information systems, radiology workflow, PACS image archiving and results-reporting software sold to health systems, imaging centers and independent labs"

products:
  - kind: laboratory_information_system
    name_template: "{line}"
    tiers: []
    known_issue_pool:
      - "specimen-routing mismatches during high-volume days"
      - "results-delivery lag during batch processing"
  - kind: radiology_information_system
    name_template: "{line} RIS"
    tiers: []
    known_issue_pool:
      - "worklist sync delays with the reading-room PACS"
  - kind: pacs_image_archive
    name_template: "{line} {tier}"
    tiers: ["Archive", "ArchivePlus"]
    known_issue_pool:
      - "large-study upload timeouts on legacy scanners"
  - kind: specimen_tracking
    name_template: "{line} Track"
    tiers: []
    known_issue_pool: []
  - kind: results_reporting_portal
    name_template: "{line} Report"
    tiers: []
    known_issue_pool:
      - "critical-result alerts occasionally delayed past the SLA window"

roles:
  - title: "Lab Director"
    seniority: director
    is_champion_candidate: true
  - title: "Radiology Medical Director"
    seniority: c_suite
    is_champion_candidate: true
  - title: "VP Diagnostic Services"
    seniority: vp
    is_champion_candidate: true
  - title: "Lab Operations Manager"
    seniority: manager
    is_champion_candidate: false
  - title: "Pathologist Lead"
    seniority: staff
    is_champion_candidate: false
  - title: "Compliance Officer"
    seniority: manager
    is_champion_candidate: false
  - title: "CFO"
    seniority: c_suite
    is_champion_candidate: false
  - title: "Referring Physician Liaison"
    seniority: staff
    is_champion_candidate: false

event_templates:
  - event_type: go_live
    weight: 1.0
    claim_templates:
      usage:
        - "{product} was deployed at {account} on {date} to handle {amount} specimens daily."
        - "{person} from {account} confirmed {product} usage spans {days} days per week."
        - "{vendor} provided {amount} training hours for {product} at {account} by {date}."
        - "{account} expanded {product} to {amount} new labs after {date} go-live."
        - "{person} at {account} reported {product} processes {amount} radiology studies weekly."
      complaint:
        - "{account} reported {product} failed {amount} test batches in the first {days} days of go-live."
        - "{person} at {vendor} received complaints from {account} about {product} delays on {date}."
        - "The {product} implementation at {account} faced {days} days of downtime during {amount} critical workflows."
        - "{account} claimed {product} integration caused {amount} billing errors in {days} days."
        - "{vendor} received {amount} defect tickets from {account} regarding {product} stability on {date}."
        - "{person} from {account} criticized {product} for missing {amount} results during the go-live period."
  - event_type: release
    weight: 1.0
    claim_templates:
      usage:
        - "{vendor} launched a {product} update for {account} on {date} with {days} days of uptime."
        - "{account} integrated {product} with {amount} external systems in {days} days."
        - "{person} at {account} tested {product} during {days} days of the release cycle."
        - "{vendor} enabled {amount} new features in {product} for {account} by {date}."
        - "{account} began using {product} for {amount} high-volume reports on {date}."
      praise:
