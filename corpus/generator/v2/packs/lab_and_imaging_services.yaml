        - "The {product} update at {account} received {amount} positive user feedback in {days} days."
        - "{person} at {account} commended {product}'s {amount} new features for streamlining workflows."
        - "{account} highlighted {product}'s {days}-hour deployment speed during the {date} release."
        - "{vendor} received {amount} five-star reviews from {account} for their {product} release on {date}."
        - "{person} from {account} noted {product} reduced errors by {amount}% in the latest release cycle."
        - "{account} called the {product} update \"the best release\" in {days} years of using the system."
        - "{vendor} was recognized by {account} for delivering {product} features on {date} ahead of schedule."
        - "{account} reported {product} usage increased by {amount} users after the {date} release."
  - event_type: incident
    weight: 1.6
    claim_templates:
      complaint:
        - "An {product} outage at {account} on {date} caused {amount} images to go unprocessed."
        - "{account} filed an incident report about {product} crashing {amount} times in {days} days."
        - "{vendor} technicians addressed {amount} {product} sync failures at {account} by {date}."
        - "The {product} system at {account} lost {amount} data entries during a {days}-hour incident."
        - "{person} from {account} reported {product} errors exceeding {amount} per day since {date}."
        - "{account} is investigating {amount} data discrepancies in {product} since {date} incident."
      risk:
        - "{vendor} risks {account} terminating {product} after the {days}-day incident on {date}."
        - "The {product} outage at {account} could delay {amount} critical diagnoses for {days} weeks."
        - "{account} is threatening to pause {product} payments if the incident isn't resolved in {days} days."
        - "The {product} incident on {date} might force {account} to seek alternatives for {amount} services."
  - event_type: escalation
    weight: 1.2
    claim_templates:
      risk:
        - "The {account} team warned that unresolved {product} issues could jeopardize the {vendor} contract."
        - "Escalation of {product} problems to {vendor} management risks a {days}-day delay in {account}'s workflow."
        - "{vendor} is at risk of losing {amount} in annual revenue from {account} due to {product} escalations."
        - "{account} indicated they might pause {product} if {vendor} fails to resolve the {days}-day delay."
      complaint:
        - "{account} escalated {product} issues to {vendor}'s CTO on {date} after {days} unresolved tickets."
        - "{person} at {vendor} elevated {account}'s {product} problem to {days}+ severity level."
        - "The {product} issue at {account} was escalated to {vendor} management on {date} due to {amount} impacts."
        - "{vendor} assigned a senior engineer to {account}'s {product} problem after {days} escalation."
        - "{account} requested executive-level intervention for their {product} disruption on {date}."
        - "The {account} team reported {product} delays of {amount} hours, prompting an escalation on {date}."
  - event_type: qbr
    weight: 1.4
