decoy_classes:
  - id: hypothetical_ms
    near_type: risk
    description: "A hypothetical framed as if it already happened."
    example: "If the new analytics module crashes during peak hours, we could lose 20 hours of productivity a week."
  - id: negation_ms
    near_type: request
    description: "A negation indicating no current action or requirement is necessary without stating any specific fact about the customer's situation."
    example: "We don't need to adjust the par levels right now\u2014let's see how the next quarter's usage trends look first."
    forbidden_patterns: [competitor_evaluation]
    text_source:
      model: "qwen/qwen3-32b"
      generated: "2026-09-23"
      raw_response_sha256:
        - "3f19229c001cbea0da4981e118865fbb926d774bc2412b49d48900a15556229b"
  - id: hearsay_other_company_ms
    near_type: competitor_mention
    description: "Something said to have happened to a different, unnamed customer."
    example: "I heard that Mercy Hospital had issues with their supply chain software last quarter, but they haven\u2019t reached out to us yet."
  - id: generic_industry_talk_ms
    near_type: other
    description: "Industry chatter with no account-specific claim."
    example: "Many hospitals are moving towards AI-driven inventory systems to cut costs, though adoption is still slow."
  - id: rhetorical_question_ms
    near_type: question
    description: "A question asked for effect, not information, with no real open item."
    example: "Who would have thought that a simple barcode scanner could reduce supply waste by so much?"
  - id: vendor_internal_speculation_ms
    near_type: risk
    description: "Vendor-side speculation about a customer, not a customer statement."
    example: "We\u2019re concerned that the client might delay their implementation due to budget cuts, but they haven\u2019t confirmed it yet."
  - id: resolved_issue_as_history_ms
    near_type: complaint
    description: "An already-resolved issue retold as past history, not a live complaint."
    example: "Back in March, we had a sync issue with their billing system, but we fixed it and haven\u2019t had any problems since."
  - id: commitment_decision_confusable_ms
    near_type: decision
    description: "A vendor commitment restated in decision-shaped language, or a customer decision restated as if it were still an open vendor promise -- easy to mistype as the other fact type."
    example: "They\u2019ve decided to commit to the new contract by Q3, but we\u2019re still waiting on their final sign-off."

