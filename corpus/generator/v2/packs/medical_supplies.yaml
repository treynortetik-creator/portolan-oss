id: medical_supplies
name: Medical supplies
vendor_what: "consumable medical supplies, par-level inventory management and supply-chain analytics software sold to hospitals and surgery centers"

products:
  - kind: wound_care_supplies
    name_template: "{line}"
    tiers: []
    known_issue_pool:
      - "backorders on specialty dressing sizes during high-demand periods"
      - "lot-tracking mismatches after a supplier substitution"
  - kind: par_level_inventory_system
    name_template: "{line} Par"
    tiers: []
    known_issue_pool:
      - "par-count drift after a manual cycle count"
  - kind: surgical_kitting
    name_template: "{line} {tier}"
    tiers: ["Kit", "KitPlus"]
    known_issue_pool:
      - "kit-pick errors on custom procedure trays"
  - kind: supply_chain_analytics
    name_template: "{line} Insights"
    tiers: []
    known_issue_pool: []
  - kind: gpo_contract_management
    name_template: "{line} Contracts"
    tiers: []
    known_issue_pool:
      - "contract-tier pricing occasionally lags a GPO amendment"

roles:
  - title: "Materials Manager"
    seniority: manager
    is_champion_candidate: true
  - title: "VP Supply Chain"
    seniority: vp
    is_champion_candidate: true
  - title: "Director of Perioperative Services"
    seniority: director
    is_champion_candidate: true
  - title: "CFO"
    seniority: c_suite
