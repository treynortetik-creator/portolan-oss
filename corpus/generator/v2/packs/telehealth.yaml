# Telehealth vertical pack -- WP2 (`01-spec/world-generator-v2-2026-09-22.md`
# section 4). Validates against `corpus/generator/v2/packs/schema.py::VerticalPack`.

id: telehealth
name: Telehealth
vendor_what: "video-visit, remote patient monitoring and virtual behavioral health platforms sold to health systems and payers"

products:
  - kind: video_visit_platform
    name_template: "{line}"
    tiers: []
    known_issue_pool:
      - "video-quality drops on low-bandwidth patient connections"
      - "waiting-room notifications occasionally delayed"
  - kind: remote_patient_monitoring
    name_template: "{line} RPM"
    tiers: []
    known_issue_pool:
      - "device-reading sync lags for cellular-connected devices"
  - kind: async_econsult_module
    name_template: "{line} {tier}"
    tiers: ["Consult", "ConsultPlus"]
    known_issue_pool:
      - "attachment upload failures on large imaging files"
  - kind: virtual_behavioral_health
    name_template: "{line} Behavioral"
    tiers: []
    known_issue_pool: []
  - kind: patient_engagement_app
    name_template: "{line} Engage"
    tiers: []
    known_issue_pool:
      - "appointment reminders occasionally duplicate across channels"

roles:
  - title: "Telehealth Program Lead"
    seniority: manager
    is_champion_candidate: true
  - title: "Chief Medical Officer"
    seniority: c_suite
    is_champion_candidate: true
  - title: "VP Ambulatory Services"
    seniority: vp
    is_champion_candidate: true
  - title: "IT Director"
    seniority: director
    is_champion_candidate: false
  - title: "Population Health Director"
    seniority: director
    is_champion_candidate: false
  - title: "CFO"
    seniority: c_suite
    is_champion_candidate: false
  - title: "Nurse Practitioner Lead"
    seniority: staff
    is_champion_candidate: false
  - title: "Behavioral Health Director"
    seniority: director
    is_champion_candidate: false

event_templates:
  - event_type: go_live
    weight: 1.0
    claim_templates:
      usage:
        - "{account} launched {product} on {date} with {amount} users."
        - "{person} at {account} activated {product} on {date} after {days} of training."
        - "The {product} deployment at {account} went live on {date}, serving {amount} clinics."
        - "{vendor} reported {account} completed {product} onboarding on {date} with {amount} daily users."
        - "{account} integrated {product} into their system on {date} after {days} of testing."
      complaint:
        - "{account} reported {product} had {days} of downtime during {date} go-live."
        - "{person} at {account} raised issues with {product} integration on {date}."
        - "The {date} {product} launch at {account} faced complaints about {amount} failed syncs."
        - "{account} cited {product} performance delays affecting {amount} clinicians on {date}."
        - "During {date} go-live, {account} noted {product} video quality dropped below acceptable standards."
        - "{vendor} received feedback from {person} at {account} about {product} onboarding delays on {date}."
