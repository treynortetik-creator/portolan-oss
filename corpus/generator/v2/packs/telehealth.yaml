decoy_classes:
  - id: hypothetical_th
    near_type: risk
    description: "A hypothetical framed as if it already happened."
    example: "We tried switching to MeridianCare's virtual behavioral health platform last quarter, but it didn\u2019t stick because our clinicians were already used to the workflow in our current system."
  - id: negation_th
    near_type: request
    description: "A polite negation that avoids committing to action or stating a decision, using phrases like 'not asking for' or 'no need' without factual claims."
    example: "Right now, I\u2019m not asking for any specific updates or next steps from your team."
    forbidden_patterns: [competitor_evaluation]
    text_source:
      model: "qwen/qwen3-32b"
      generated: "2026-09-23"
      raw_response_sha256:
        - "1b398cc300d9426bcf7a442d43d7d9163eaffaa359f22548ad529abea0bf882e"
  - id: hearsay_other_company_th
    near_type: competitor_mention
    description: "Something said to have happened to a different, unnamed customer."
    example: "I heard that ClearMed had to delay their telehealth rollout due to HIPAA compliance issues last summer."
  - id: generic_industry_talk_th
    near_type: other
    description: "Industry chatter with no account-specific claim."
    example: "Telehealth adoption is surging across the industry, especially in rural areas where access to behavioral health services is limited."
  - id: rhetorical_question_th
    near_type: question
    description: "A question asked for effect, not information, with no real open item."
    example: "Who could have predicted how essential virtual behavioral health would become in 2024?"
  - id: vendor_internal_speculation_th
    near_type: risk
    description: "Vendor-side speculation about a customer, not a customer statement."
    example: "I\u2019ve got a feeling Cedar Hill Health might be circling NeoHealth\u2019s MindSphere platform for behavioral health, but their CIO told us last quarter they\u2019re not ready to jettison our virtual care suite just yet."
  - id: resolved_issue_as_history_th
    near_type: complaint
    description: "An already-resolved issue retold as past history, not a live complaint."
    example: "We had some sync issues with AuroraHealth's RPM module back in 2022, but it's all smoothed out now after their latest update."
  - id: commitment_decision_confusable_th
    near_type: decision
    description: "A vendor commitment restated in decision-shaped language, or a customer decision restated as if it were still an open vendor promise -- easy to mistype as the other fact type."
    example: "We decided to go with HealthBridge's video-visit solution because it felt like the most mature option, even though the contract wasn't technically finalized yet."

