# Healthcare staffing vertical pack -- WP2 (`01-spec/world-generator-v2-2026-09-22.md`
# section 4). Validates against `corpus/generator/v2/packs/schema.py::VerticalPack`.

id: healthcare_staffing
name: Healthcare staffing
vendor_what: "nurse staffing marketplace, credentialing and vendor-management software sold to hospitals and health systems"

products:
  - kind: nurse_staffing_marketplace
    name_template: "{line}"
    tiers: []
    known_issue_pool:
      - "shift-bid notifications occasionally delayed during peak posting windows"
      - "duplicate shift postings after a schedule edit"
  - kind: credentialing_management
    name_template: "{line} Credential"
    tiers: []
    known_issue_pool:
      - "license-expiration alerts occasionally fire a day late"
  - kind: vendor_management_system
    name_template: "{line} {tier}"
    tiers: ["VMS", "VMS Pro"]
    known_issue_pool:
      - "rate-card mismatches between agencies during contract renewals"
  - kind: float_pool_scheduling
    name_template: "{line} Float"
    tiers: []
    known_issue_pool: []
  - kind: compliance_tracking
    name_template: "{line} Compliance"
    tiers: []
    known_issue_pool:
      - "compliance dashboard occasionally lags nightly credential sync"

roles:
  - title: "Chief Nursing Officer"
    seniority: c_suite
    is_champion_candidate: true
  - title: "Staffing Coordinator"
    seniority: manager
    is_champion_candidate: true
  - title: "HR/Talent Acquisition Director"
    seniority: director
    is_champion_candidate: false
  - title: "VP Workforce Management"
    seniority: vp
    is_champion_candidate: true
  - title: "Director of Clinical Operations"
    seniority: director
    is_champion_candidate: false
  - title: "CFO"
    seniority: c_suite
    is_champion_candidate: false
  - title: "Credentialing Manager"
    seniority: manager
    is_champion_candidate: false
  - title: "Nurse Manager"
    seniority: manager
    is_champion_candidate: true

