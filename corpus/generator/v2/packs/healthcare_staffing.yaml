# One shared generic directive list, aliased into every fact type (section 4,
# "Phrasing": a phrasing-style vocabulary applied across types, not
# type-specific content -- same pattern as medical_devices.yaml).
fact_directives:
  complaint: &directives
    - hedged
    - numbers_spelled_out
    - colloquial
    - embedded_mid_sentence
    - passive
    - through_an_alias
    - corrected_mid_sentence
    - list_item
    - terse
    - rambling
    - formal
    - via_quoted_reply
    - second_language_phrasing
  request: *directives
  praise: *directives
  risk: *directives
  competitor_mention: *directives
  commitment: *directives
  decision: *directives
  contact_change: *directives
  pricing: *directives
  usage: *directives
  question: *directives
  other: *directives

