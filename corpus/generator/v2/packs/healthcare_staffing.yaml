decoy_classes:
  - id: hypothetical_st
    near_type: risk
    description: "A hypothetical framed as if it already happened."
    example: "We switched to NurseLink\u2019s platform last year but had to roll back after a credentialing glitch exposed patient records, which is why we\u2019re sticking with HealthBridge Systems for now."
  - id: negation_st
    near_type: request
    description: "A negation that politely indicates no immediate action is necessary without implying a request, promise, or task for either party."
    example: "I don\u2019t need anything else right now, but I\u2019ll keep this in mind for later."
    forbidden_patterns: [competitor_evaluation]
    text_source:
      model: "qwen/qwen3-32b"
      generated: "2026-09-23"
      raw_response_sha256:
        - "9b6f08e2696a6ebac6cd68acc0ae8804b0ddf088121cb08dd2a2486159bb75d0"
        - "0414c35d45a1325df75924b3b81b95ac561ba3a4db59e42946432fa9eab1dd85"
  - id: hearsay_other_company_st
    near_type: competitor_mention
    description: "Something said to have happened to a different, unnamed customer."
    example: "A client in Chicago mentioned they switched to a different platform after 6 months due to recurring issues."
  - id: generic_industry_talk_st
    near_type: other
    description: "Industry chatter with no account-specific claim."
    example: "Nurse retention rates are dropping in healthcare as new platforms fail to meet rising compliance demands."
  - id: rhetorical_question_st
    near_type: question
    description: "A question asked for effect, not information, with no real open item."
    example: "Who could have predicted that real-time credentialing would become the gold standard in 2024?"
  - id: vendor_internal_speculation_st
    near_type: risk
    description: "Vendor-side speculation about a customer, not a customer statement."
    example: "We think HealthPoint might be pulling back from our RFP since their last meeting didn\u2019t include any new proposals, but it\u2019s just our hunch."
  - id: resolved_issue_as_history_st
    near_type: complaint
    description: "An already-resolved issue retold as past history, not a live complaint."
    example: "We had a minor snafu with Nexura's vendor management system back in 2022 where some contractor credentials got delayed, but they patched it up quickly, so we\u2019ve been sticking with them ever since."
  - id: commitment_decision_confusable_st
    near_type: decision
    description: "A vendor commitment restated in decision-shaped language, or a customer decision restated as if it were still an open vendor promise -- easy to mistype as the other fact type."
    example: "We'll deliver the new compliance module by Q3, as the client already approved in their 2024 renewal terms."

