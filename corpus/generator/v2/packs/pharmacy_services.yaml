# Pharmacy services vertical pack -- WP2 (`01-spec/world-generator-v2-2026-09-22.md`
# section 4). Validates against `corpus/generator/v2/packs/schema.py::VerticalPack`.

id: pharmacy_services
name: Pharmacy services
vendor_what: "central-fill dispensing, medication synchronization, adherence packaging and specialty pharmacy software sold to health systems and pharmacies"

products:
  - kind: central_fill_dispensing
    name_template: "{line}"
    tiers: []
    known_issue_pool:
      - "occasional canister miscounts after a refill cycle"
      - "queue backlog during month-end volume spikes"
  - kind: medication_synchronization
    name_template: "{line} Sync"
    tiers: []
    known_issue_pool:
      - "sync-date reminders occasionally duplicate across household accounts"
  - kind: adherence_packaging
    name_template: "{line} {tier}"
    tiers: ["Pouch", "Blister"]
    known_issue_pool:
      - "pouch-seal failures on high-humidity days"
  - kind: specialty_pharmacy_program
    name_template: "{line} Specialty"
    tiers: []
    known_issue_pool:
      - "prior-authorization status sync lags the payer portal"
  - kind: pharmacy_inventory_automation
    name_template: "{line} Cabinet"
    tiers: []
    known_issue_pool: []

roles:
  - title: "Pharmacy Director"
    seniority: director
    is_champion_candidate: true
  - title: "Chief Pharmacy Officer"
    seniority: c_suite
    is_champion_candidate: false
  - title: "Pharmacy Operations Manager"
    seniority: manager
    is_champion_candidate: true
  - title: "Clinical Pharmacist Lead"
    seniority: staff
    is_champion_candidate: true
  - title: "Procurement Manager"
    seniority: manager
    is_champion_candidate: false
  - title: "Compliance Officer"
    seniority: manager
    is_champion_candidate: false
  - title: "CFO"
    seniority: c_suite
    is_champion_candidate: false
  - title: "Inventory Manager"
    seniority: staff
    is_champion_candidate: false

