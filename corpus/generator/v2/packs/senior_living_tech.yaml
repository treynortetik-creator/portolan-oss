decoy_classes:
  - id: hypothetical_sl
    near_type: risk
    description: "A hypothetical framed as if it already happened."
    example: "We considered adopting NexCare's all-in-one platform last year, but our directors decided to stick with our existing system since the integration with our dietary and billing modules was already running smoothly."
  - id: negation_sl
    near_type: request
    description: "A customer uses a negation to dismiss an implicit request while hinting at future interest without stating needs, commitments, or status."
    example: "I\u2019m not asking for anything else right now, but I\u2019m curious how the system handles updating care plans when resident preferences change mid-month."
    forbidden_patterns: [competitor_evaluation]
    text_source:
      model: "qwen/qwen3-32b"
      generated: "2026-09-23"
      raw_response_sha256:
        - "28eae1b02291a971e1c040806c050ce36c18cb5783fbe3ffc60928216db503c6"
  - id: hearsay_other_company_sl
    near_type: competitor_mention
    description: "Something said to have happened to a different, unnamed customer."
    example: "We heard NexCare had to roll back their eMAR update last quarter due to integration hiccups with a pharmacy system, so we\u2019re sticking with our current setup until their next release."
  - id: generic_industry_talk_sl
    near_type: other
    description: "Industry chatter with no account-specific claim."
    example: "Many communities are struggling with staff scheduling gaps as turnover rates hit record highs this year."
  - id: rhetorical_question_sl
    near_type: question
    description: "A question asked for effect, not information, with no real open item."
    example: "Who could blame them for wanting more visibility into their billing processes with these new regulations?"
  - id: vendor_internal_speculation_sl
    near_type: risk
    description: "Vendor-side speculation about a customer, not a customer statement."
    example: "We considered switching to Greenfield Health Systems' eMAR solution last quarter, but their staffing module didn't integrate as smoothly with our existing dietary workflows as we'd hoped."
  - id: resolved_issue_as_history_sl
    near_type: complaint
    description: "An already-resolved issue retold as past history, not a live complaint."
    example: "Last year's data migration issues were fully resolved after we worked with the vendor's support team for three weeks."
  - id: commitment_decision_confusable_sl
    near_type: decision
    description: "A vendor commitment restated in decision-shaped language, or a customer decision restated as if it were still an open vendor promise -- easy to mistype as the other fact type."
    example: "We promised to deliver the new module by Q3 and now the customer is treating it as a decision already made."

