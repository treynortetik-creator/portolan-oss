# Senior-living tech vertical pack -- WP2 (`01-spec/world-generator-v2-2026-09-22.md`
# section 4). Validates against `corpus/generator/v2/packs/schema.py::VerticalPack`.
#
# Guard (the maintainer, 2026-09-22): excludes resident fall detection, fall prevention, resident monitoring, video monitoring of residents, and any product in that category -- a category deliberately out of scope. Covers other senior-living operator tech only: care-plan documentation, medication management, staffing and scheduling, family communication, billing, dietary, maintenance. Enforced by `tests/test_world_generator_v2_packs.py::test_senior_living_pack_excludes_monitoring_category` (scans this pack's products and events for fall/monitor*/camera/video/sensor).

id: senior_living_tech
name: Senior-living tech
vendor_what: "care-plan documentation, medication management, staffing and scheduling, family communication, billing and dietary software sold to senior-living operators"

products:
  - kind: care_plan_documentation
    name_template: "{line}"
    tiers: []
    known_issue_pool:
      - "care-plan sync delays after a shift change"
      - "PDF export formatting breaks on long care plans"
  - kind: emar_medication_management
    name_template: "{line} {tier}"
    tiers: ["MAR", "Plus"]
    known_issue_pool:
      - "occasional duplicate dose alerts on PRN medications"
      - "barcode scan failures on relabeled unit-dose packaging"
  - kind: staffing_scheduling
    name_template: "{line} Schedule"
    tiers: []
    known_issue_pool:
      - "shift-swap requests occasionally not routed to the right supervisor"
  - kind: family_communication_portal
    name_template: "{line} Connect"
    tiers: []
    known_issue_pool:
      - "photo uploads time out on the family app during peak evening hours"
  - kind: billing_and_dietary
    name_template: "{line} Billing"
    tiers: []
    known_issue_pool: []
  - kind: maintenance_work_orders
    name_template: "{line} Maintenance"
    tiers: []
    known_issue_pool:
      - "work-order status occasionally stuck in \"assigned\""

roles:
  - title: "Community Executive Director"
    seniority: director
    is_champion_candidate: true
  - title: "Director of Nursing"
    seniority: director
    is_champion_candidate: true
  - title: "Regional VP of Operations"
    seniority: vp
    is_champion_candidate: false
  - title: "Business Office Manager"
    seniority: manager
    is_champion_candidate: false
  - title: "Dietary Services Director"
    seniority: director
    is_champion_candidate: false
  - title: "Staffing Coordinator"
    seniority: manager
    is_champion_candidate: true
  - title: "Family Engagement Coordinator"
    seniority: staff
    is_champion_candidate: false
  - title: "IT Director"
    seniority: director
    is_champion_candidate: false

