# ---------------------------------------------------------------------------
# EXPECTED OUTCOMES the bench and the report tests check.
# ---------------------------------------------------------------------------
expectations:
  extraction:
    # planted_facts: python -c "print(38 + 35)" -> 73
    # (v0's 38 F01..F36/F11b/F15b, plus v1.1's 35 F37..F71: F37-F54, F40b, F56-F71)
    planted_facts: 73
    distractors_must_not_yield_facts: [D01, D02, D03, D04]
    quote_required_types_have_quotes: true
    every_fact_has_locator: true
  merge:
    cross_source_single_claim: {F02: 2, F19: 2, F11: 2, F11b: 2, F34: 2}   # fact → number of citations on ONE claim
    supersessions: [{old: F11, new: F11b}, {old: F15, new: F15b}, {old: F40, new: F40b}]
    unknown_entity_queue_contains: [maria-chen-personal, "Renata Solis"]
    ambiguous_resolution: {F03: larkspur}   # "Larkspur" alone attaches to the parent with a flag, or resolves to memorial via the borrowing context
    # Two INDEPENDENT hierarchies, not one chain: Wrenfield Health is its
    # own root account (`parent: null` in `accounts:` above), not a child
    # of Larkspur Memorial. v1.1 (2026-09-13) first landed this as one
    # flat list appended onto the v0 chain -- `[pinecrest, larkspur,
    # larkspur-memorial, wrenfield, wrenfield-medical]` -- which
    # `portolan/bench/graph.py`'s `_check_parent_chain` reads as a single
    # ordered child->parent walk, requiring wrenfield.parent_id ==
    # larkspur-memorial's id. That contradicts this very file's own
    # `accounts:` block and can never pass. Fixed 2026-09-13 by splitting
    # into `parent_chains` (a list of chains); `score_graph` now checks
    # each independently.
    parent_chains:
      - [pinecrest, larkspur, larkspur-memorial]
      - [wrenfield, wrenfield-medical]
  filter:
    excluded_by_customer_filter: [S-email-061]
    included_by_registry_scan: [S-email-062]
    sample_audit_should_find: [F07]
    junk_filtered: [S-email-040]
    quoted_text_stripped: S-email-021-thread
  report:
    # v1.2 (theme review fix wave, 2026-09-13, "Wave-based themes"
    # recommendation, 01-spec/reviews/review-theme-fix-wave.md): pricing_
    # pushback moved OUT of `themes:` (below) and into `waves:` (below
    # `themes_by_week:`) -- it is a temporal-proximity pattern (three
    # accounts pushing back on price the same week), not a content-
    # similarity one, per the review's own pairwise-cosine measurement
    # (Cobalt Ridge's invoice-credit complaint scores 0.780 against an
    # UNRELATED St. Aldric invoice dispute and only 0.550/0.554 against
    # its own two truth-table partners).
    #
    # v1.1 (2026-09-13): two themes tracked across the four weeks ending the
    # window (2026-08-10, 08-17, 08-24, 08-31). `themes` gives each theme's full
    # shape; `themes_by_week` gives the per-week state (new/rising/peak/falling/
    # resolved/quiet) the weekly report's own theme narrative should match.
    themes:
      late_deliveries:
        name: "Late deliveries, Midwest"
        first_seen: 2026-07-30
        rising_in_week_of: 2026-08-17
        peaked_week_of: 2026-08-17
        # Nit 18 (`01-spec/reviews/review-theme-fix-wave-3.md`): this used
        # to say `2026-09-01`, a date no single fact below actually
        # carries -- F61/F62 are 2026-08-31, F63 is 09-02, F64 is 09-03,
        # F65 is 09-04, all in the SAME ISO week (`week_start` -> 08-31).
        #
        # Decisions log 2026-09-14 ("withdraw content-based automatic
        # resolution"): automatic resolution BY CONTENT is withdrawn --
        # this theme is now PROPOSED in the week of 2026-08-31 (any member
        # of `resolution_facts` the resolution judge accepts first, still
        # not tuned to prefer one over another) and CONFIRMED only when a
        # human does so via `/review` -- `portolan.report.themes.
        # _check_theme_resolutions` writes the proposal, `confirm_theme_
        # resolution` is the human step the bench has to perform (or
        # simulate) before this theme reads `resolved` rather than
        # `"resolution proposed"`.
        resolved_week_of: 2026-08-31  # the week it is PROPOSED; resolved only after a human confirms
        accounts: [ashgrove-medical, larkspur-memorial, cobalt-ridge, northlake-general, meadowbrook]
        # linked_arr: python -c "print(1600000+900000+610000+1180000+340000)" -> 4630000
        # (accounts unchanged from v0; corrected 2026-09-12, reconfirmed 2026-09-13)
        linked_arr: 4630000
        linked_facts: [F01, F02, F03, F04, F05, F06, F37, F44, F45, F47, F48, F49, F51, F61, F62, F63, F64, F65]
        # F61 = the Dayton hire decision (a `decision`-type resolution
        # candidate, not itself required to clear the gate); F62-F65 =
        # the praise wave -- the theme is PROPOSED once ANY member of this
        # set clears the mechanical prefilter and the resolution judge
        # (`portolan.report.themes._check_theme_resolutions`), not a
        # specific one; a human confirming that proposal is what makes it
        # RESOLVED.
        resolution_facts: [F61, F62, F63, F64, F65]
      tidewater_link_epic:
        name: "Tidewater Link / Epic integration requests"
        first_seen: 2026-08-12
        rising_in_week_of: 2026-08-24
        accounts: [st-aldric, wrenfield, driftwood]   # three accounts, per the task
        # linked_arr: python -c "print(980000 + (980000+430000) + 450000)" -> 2840000
        linked_arr: 2840000
        linked_facts: [F39, F40, F40b, F50, F56, F57, F58, F67]
    themes_by_week:
      - week_of: 2026-08-10
        late_deliveries: rising
        tidewater_link_epic: new
      - week_of: 2026-08-17
        late_deliveries: peak
        tidewater_link_epic: rising
      - week_of: 2026-08-24
        late_deliveries: falling
        tidewater_link_epic: rising
      - week_of: 2026-08-31
        # Decisions log 2026-09-14: PROPOSED, not resolved, until a human
        # confirms it -- `portolan.report.models.Movement`'s own
        # `"resolution proposed"` value. The bench checks the proposal
        # (theme, claim, evidence) here; a separate confirm step is what
        # would make this `resolved` in a later week's report.
        late_deliveries: resolution proposed
        tidewater_link_epic: rising
    # waves (v1.2, theme review fix wave): portolan.report.waves.compute_
    # waves -- a mechanical GROUP BY fact_type, product family, and
    # calendar week, with an account-count floor (WAVE_MIN_ACCOUNTS = 3),
    # zero model calls, zero clustering. pricing_pushback was the
    # motivating example (see the v1.2 note above `themes:`), but it does
    # NOT actually clear the floor in this corpus once product family is
    # required, and that is the mechanically honest answer, not a defect
    # to work around:
    #   - F53 (larkspur-regional-health) and F54 (anchor-bay-surgical-
    #     partners), both dated 2026-08-2[5-6], both `pricing`, both
    #     resolve to product family `tidewater` -- 2 accounts.
    #   - F52 (cobalt-ridge-medical-center, 2026-08-24) is ALSO `pricing`
    #     the same week, but resolves to product family `halvardcare`
    #     (a delivery-delay credit on a HalvardCare invoice), not
    #     `tidewater` -- a genuinely different ask, not a paraphrase of
    #     the other two. It correctly does not join their group.
    #   - F12 (larkspur-regional-health, 2026-06-09) is `pricing`/
    #     `tidewater` too, but ten weeks earlier -- a different
    #     calendar-week group entirely, so it was never really part of a
    #     "week of 08-24" pattern in the first place (the old `themes:`
    #     entry's own `linked_facts: [F12, F52, F53, F54]` folded a June
    #     fact into an "August" theme by construction, which a
    #     mechanical week-bucketed wave cannot do).
    # So `waves` expects NO pricing wave for the week of 2026-08-24 in
    # this corpus -- 2 accounts on `tidewater`, one short of
    # WAVE_MIN_ACCOUNTS. Confirmed against a real refresh_themes-built
    # graph: `compute_waves` over 2026-03-01..2026-09-10 produces three
    # waves total (complaint/tidewater weeks of 08-10 and 08-17, each
    # already covered by the late_deliveries theme's own membership, and
    # a praise/tidewater wave the week of 08-31) and no pricing wave at
    # any point -- those three are now recorded below (should-fix 10),
    # not just the negative pricing case.
    waves:
      expected_min_accounts: 3
      pricing_week_of_2026_08_24:
        product_family: tidewater
        accounts: [larkspur, anchor-bay]   # 2 -- below the floor, no wave expected
        excluded: {cobalt-ridge: "F52 resolves to product family halvardcare, not tidewater"}
      # Should-fix 10 (`01-spec/reviews/review-theme-fix-wave-2.md` finding
      # 10): the three waves this corpus's own `compute_waves` actually
      # DOES produce, recorded with the facts that plant them -- the
      # review's own complaint was that only the negative case (above) was
      # ever written down. `facts` lists the truth-table facts known to
      # plant each wave's own accounts; `compute_waves` may pick up a few
      # additional generator-synthesized filler claims from the same
      # account/product/week that carry no F-number of their own (the same
      # "not a complete enumeration" caveat `themes.late_deliveries.
      # linked_facts` already carries) -- `tests/test_report_waves.py`'s
      # own bench checks `>= len(facts)` accounts/claims, not `==`, for
      # exactly that reason.
      complaint_week_of_2026_08_10:
        product_family: tidewater
        accounts: [northlake-general, cobalt-ridge, larkspur-north]
        facts: [F04, F37, F38]
      complaint_week_of_2026_08_17:
        product_family: tidewater
        accounts: [ashgrove-riverside, cobalt-ridge, meadowbrook, northlake-general]
        facts: [F44, F45, F49, F51]
      praise_week_of_2026_08_31:
        product_family: tidewater
        accounts: [ashgrove-medical, cobalt-ridge, larkspur-memorial, meadowbrook]
        facts: [F62, F63, F64, F65]
    # theme: kept for backward compatibility with anything still reading the v0 singular
    # key -- identical to themes.late_deliveries minus the v1.1 resolution/rising facts.
    theme: {name: "Late deliveries, Midwest", first_seen: 2026-07-30, rising_in_week_of: 2026-08-17, accounts: [ashgrove-medical, larkspur-memorial, cobalt-ridge, northlake-general, meadowbrook], linked_arr: 4630000, linked_facts: [F01, F02, F03, F04, F05, F06]}
    actions_open: [{from: F09, owner: sam-okafor, due: 2026-08-28}, {from: F32, owner: dana-whitlock}, {from: F33, owner: null}, {from: F57, owner: priya-natarajan, due: 2026-09-10}, {from: F58, owner: dana-whitlock, due: 2026-09-05}]
    quiet_accounts_as_of_2026-09-11: [sable-valley, kestrel]   # v1.1 activity (F39/F50, F60) pulls st-aldric and vireo off this list
    contact_changes: [F28, F29, F30, F59, F60]
