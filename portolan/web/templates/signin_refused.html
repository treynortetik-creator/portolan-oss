{% extends "base.html" %}
{% block title %}Sign-in refused — Portolan{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:40px auto 0;">
  <p class="eyebrow">Sign-in refused</p>
  <h1 style="margin-top:0;">You can't open this Portolan with that account.</h1>
  <p id="refusal">{{ message }}</p>
  {% if logout_url %}
    <p><a class="btn primary" href="{{ logout_url }}">Sign out and use another account</a></p>
  {% else %}
    <p><a class="btn primary" href="/login">Start again</a></p>
  {% endif %}
</div>
{% endblock %}
