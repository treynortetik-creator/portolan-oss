{% extends "base.html" %}
{% block title %}{{ slug }} (original) — Portolan{% endblock %}
{% block content %}
<p class="eyebrow"><a href="/sources/{{ slug }}">&larr; Source</a></p>
<h1 style="margin-top:0;" class="mono">{{ slug }}</h1>
<div class="card">
  <iframe
    src="/originals/{{ slug }}/raw{% if page %}#page={{ page }}{% endif %}"
    style="width:100%;height:80vh;border:1px solid var(--pl-line);"
    title="{{ slug }}"
  ></iframe>
</div>
{% endblock %}
